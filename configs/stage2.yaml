# TEMOTTS Stage II: emotion data pruning + emotional text adaptation module.
pruning:
  p_th: 0.7            # dominant-emotion probability threshold (paper: 0.7)

model:
  in_dim: 768          # DistilRoBERTa-base hidden size (mean-pooled last layer)
  hidden: [772, 600, 500, 400, 300, 200, 100, 50, 40]
  # n_tokens is taken from the Stage I GST (16)

optim:
  peak_lr: 1.0e-3
  betas: [0.9, 0.999]
  eps: 1.0e-8
  warmup_steps: 4000
  grad_clip: 1.0

train:
  batch_size: 32
  max_steps: 20000
  log_interval: 20
  val_interval: 100
  seed: 777

demo_sentences: configs/demo_sentences.txt
